name: Bug report
description: Report a reproducible Android-use problem without publishing private device data.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include serials, tokens, screenshots, recordings, account data, or private logs.
  - type: input
    id: version
    attributes:
      label: au version
      placeholder: "au --version"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Computer and Android Use version
      placeholder: "Windows/macOS/Linux and x64/ARM64; au version"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android device and version
      placeholder: "Android version and device model; omit serials"
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Connection
      options: [USB, Wireless ADB, Other]
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or agent request
      description: Remove secrets, account data, serials, and private URLs.
      placeholder: "au doctor"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use the smallest command sequence with private identifiers removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Safe diagnostics
      description: Paste redacted `au doctor --json` output or error text. Do not attach captures, recordings, tokens, or account data.
