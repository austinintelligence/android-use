[package]
name = "au"
version = "3.0.0"
edition = "2021"
rust-version = "1.94"
description = "A small typed Android control engine for agents"
license = "MIT"
repository = "https://github.com/drperky20/android-use"
publish = false

[[bin]]
name = "au"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
png = "0.17"

[dev-dependencies]
tempfile = "3.14"
