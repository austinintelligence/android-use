name: Release
on: { push: { tags: ['v3.*'] } }
permissions: { contents: write }
jobs:
  computer:
    strategy: { matrix: { os: [ubuntu-24.04, windows-2022, macos-15] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: cargo +1.94.0 test --workspace --all-targets
      - run: cargo +1.94.0 build --profile dist -p au
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: 'au-${{ matrix.os }}', path: 'target/dist/au*' }
  helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96
        with: { gradle-version: '9.1.0' }
      - name: Require owner helper signer
        shell: pwsh
        env:
          AUBRIDGE_KEYSTORE_B64: ${{ secrets.AUBRIDGE_KEYSTORE_B64 }}
          AUBRIDGE_STORE_PASSWORD: ${{ secrets.AUBRIDGE_STORE_PASSWORD }}
          AUBRIDGE_KEY_PASSWORD: ${{ secrets.AUBRIDGE_KEY_PASSWORD }}
        run: |
          if (!$env:AUBRIDGE_KEYSTORE_B64 -or !$env:AUBRIDGE_STORE_PASSWORD -or !$env:AUBRIDGE_KEY_PASSWORD) { throw 'Owner helper signing secrets are required.' }
          $state = Join-Path $env:LOCALAPPDATA 'Codex/android-use'
          New-Item -ItemType Directory -Force (Join-Path $state 'keys') | Out-Null
          $key = Join-Path $state 'keys/aubridge.keystore'
          [IO.File]::WriteAllBytes($key,[Convert]::FromBase64String($env:AUBRIDGE_KEYSTORE_B64))
          @("storeFile=$key","storePassword=$env:AUBRIDGE_STORE_PASSWORD",'keyAlias=aubridge',"keyPassword=$env:AUBRIDGE_KEY_PASSWORD") | Set-Content (Join-Path $state 'signing.properties')
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
        working-directory: device
      - name: Verify pinned helper signer
        shell: pwsh
        run: |
          $apk = 'device/app/build/outputs/apk/release/app-release.apk'
          $tool = Get-ChildItem "$env:ANDROID_HOME/build-tools/*/apksigner" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $text = (& $tool verify --print-certs $apk | Out-String)
          $actual = [regex]::Match($text,'SHA-256 digest:\s*([0-9a-fA-F]+)').Groups[1].Value.ToLowerInvariant()
          $expected = (Get-Content device/release-signer.sha256 -Raw).Trim().ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Helper signer does not match the pinned release signer.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: { name: aubridge, path: device/app/build/outputs/apk/release/app-release.apk }
