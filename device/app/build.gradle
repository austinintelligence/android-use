plugins {
    id "com.android.application"
}

def releaseVersion = file("../../VERSION").text.trim()
def signingPropertiesPath = System.getenv("AUBRIDGE_SIGNING_PROPERTIES")
def versionParts = releaseVersion.tokenize(".")*.toInteger()
// The release key is used only by the release build type, and only when this file is named explicitly.
def signingPropertiesFile = signingPropertiesPath ? file(signingPropertiesPath) : null
if (signingPropertiesFile != null && !signingPropertiesFile.exists()) {
    throw new GradleException("AUBRIDGE_SIGNING_PROPERTIES names a file that does not exist: " + signingPropertiesFile)
}
def releaseSigned = signingPropertiesFile != null
def signingProperties = new Properties()
if (releaseSigned) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace = "dev.codex.aubridge"
    compileSdk = 36
    buildToolsVersion = "36.0.0"

    defaultConfig {
        applicationId = "dev.codex.aubridge"
        minSdk = 26
        targetSdk = 36
        versionCode = versionParts[0] * 1_000_000 + versionParts[1] * 1_000 + versionParts[2]
        versionName = releaseVersion
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        persistent {
            if (releaseSigned) {
                storeFile = file(signingProperties.getProperty("storeFile"))
                storePassword = signingProperties.getProperty("storePassword")
                keyAlias = signingProperties.getProperty("keyAlias")
                keyPassword = signingProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            debuggable = false
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
            if (releaseSigned) {
                signingConfig = signingConfigs.persistent
            }
        }
    }

    packaging {
        // Kotlin metadata that nothing at runtime reads; the helper is pure Java.
        resources.excludes += ["kotlin/**", "META-INF/version-control-info.textproto"]
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20250517"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}
