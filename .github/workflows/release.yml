name: Release

on:
  push:
    tags: ['v*']
  # A dry run builds and checks everything, stops before signing, and publishes nothing. Run it on the
  # commit you mean to tag; it works from any branch because no job that needs an environment runs.
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: two runs for the same tag would race to create the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Release builds must not fail on a passing DNS or registry hiccup.
  CARGO_NET_RETRY: 10

jobs:
  gate:
    name: Check the tag is a green commit on main
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a green CI run on a commit that is on main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq .total_count)"
          test "$passed" -gt 0 || { echo "::error::CI has not passed on $GITHUB_SHA"; exit 1; }

  validate:
    name: Build and validate the unsigned helper
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - name: Validate immutable release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96
        with:
          gradle-version: '9.1.0'
      - name: Install Rust release toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy; rustup default 1.94.0
      - name: Run the complete release validation gate
        run: cargo +1.94.0 xtask verify
      - name: Stage the unsigned Android helper
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          mkdir unsigned-helper
          cp device/app/build/outputs/apk/release/app-release-unsigned.apk "unsigned-helper/android-use-v$version-android.apk"
      - name: Generate the SPDX software bill of materials
        uses: anchore/sbom-action@43a17d6e7add2b5535efe4dcae9952337c479a93
        with:
          path: .
          format: spdx-json
          output-file: android-use.spdx.json
      - name: Stage the SBOM
        shell: bash
        run: |
          test -s android-use.spdx.json
          mkdir release-sbom
          mv android-use.spdx.json release-sbom/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unsigned-helper
          path: unsigned-helper/android-use-*-android.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-sbom
          path: release-sbom/android-use.spdx.json
          if-no-files-found: error

  # Signing runs no repository code: no checkout, no npm, no cargo. It downloads the unsigned APK, signs
  # it with the SDK's apksigner, and checks the certificate against the pin stored at the tagged commit.
  sign:
    name: Sign and verify the helper
    needs: [gate, validate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release-signing
    permissions:
      contents: read
    steps:
      - name: Refuse to sign until the owner has set the environment up
        env:
          READY: ${{ vars.RELEASE_SIGNING_READY }}
        run: test "$READY" = true || { echo "::error::set RELEASE_SIGNING_READY=true on the release-signing environment once it has its reviewers and secrets"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unsigned-helper
          path: unsigned
      - name: Sign, then require exactly one signer with the pinned certificate
        env:
          GH_TOKEN: ${{ github.token }}
          AUBRIDGE_KEYSTORE_B64: ${{ secrets.AUBRIDGE_KEYSTORE_B64 }}
          AUBRIDGE_STORE_PASSWORD: ${{ secrets.AUBRIDGE_STORE_PASSWORD }}
          AUBRIDGE_KEY_PASSWORD: ${{ secrets.AUBRIDGE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          apk="android-use-v${GITHUB_REF_NAME#v}-android.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          test -n "$signer"
          expected="$(gh api "repos/$GITHUB_REPOSITORY/contents/device/release-signer.sha256?ref=$GITHUB_SHA" -H 'Accept: application/vnd.github.raw' | tr -d '\r\n' | tr 'A-F' 'a-f')"
          printf '%s' "$expected" | grep -Eq '^[0-9a-f]{64}$'
          keystore="$RUNNER_TEMP/aubridge.keystore"
          printf '%s' "$AUBRIDGE_KEYSTORE_B64" | base64 --decode > "$keystore"
          mkdir signed
          "$signer" sign --ks "$keystore" --ks-key-alias aubridge --ks-pass env:AUBRIDGE_STORE_PASSWORD --key-pass env:AUBRIDGE_KEY_PASSWORD --out "signed/$apk" "unsigned/$apk"
          rm -f "$keystore"
          certs="$("$signer" verify --print-certs "signed/$apk")"
          actual="$(printf '%s\n' "$certs" | sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: *//p' | tr 'A-F' 'a-f')"
          test "$(printf '%s\n' "$actual" | grep -c .)" = 1 || { echo "::error::expected exactly one signer"; exit 1; }
          test "$actual" = "$expected" || { echo "::error::signer $actual is not the pinned $expected"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-helper
          path: signed/android-use-*-android.apk
          if-no-files-found: error

  host-archives:
    name: Build ${{ matrix.label }} archive
    needs: [validate, sign]
    # A dry run skips signing, so it embeds the unsigned helper and never publishes.
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    strategy:
      fail-fast: false
      # Keep in step with install/platforms.json (`cargo xtask version` checks it).
      matrix:
        include:
          - { label: macOS Apple Silicon, runner: macos-15, asset: macos-aarch64, archive: tar.gz, binary: au, target: aarch64-apple-darwin }
          - { label: macOS Intel, runner: macos-15, asset: macos-x86_64, archive: tar.gz, binary: au, target: x86_64-apple-darwin }
          - { label: Linux x86_64, runner: ubuntu-24.04, asset: linux-x86_64, archive: tar.gz, binary: au, target: x86_64-unknown-linux-gnu }
          - { label: Linux arm64, runner: ubuntu-24.04-arm, asset: linux-aarch64, archive: tar.gz, binary: au, target: aarch64-unknown-linux-gnu }
          - { label: Windows x86_64, runner: windows-2022, asset: windows-x86_64, archive: zip, binary: au.exe, target: x86_64-pc-windows-msvc }
          - { label: Windows arm64, runner: windows-2022, asset: windows-aarch64, archive: zip, binary: au.exe, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - name: Install Rust release toolchain
        shell: bash
        run: |
          rustup toolchain install 1.94.0 --profile minimal --target "${{ matrix.target }}"
          rustup default 1.94.0
      - name: Verify release version
        run: cargo +1.94.0 xtask version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.sign.result == 'success' && 'release-helper' || 'unsigned-helper' }}
          path: helper
      - name: Build the host binary with the helper embedded
        shell: bash
        run: |
          AU_EMBED_APK="$(ls "$PWD"/helper/*android.apk)" cargo +1.94.0 build --locked --profile dist -p au --target "${{ matrix.target }}"
      - name: Package the archive
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          name="android-use-v$version-${{ matrix.asset }}"
          mkdir -p stage release
          cp "target/${{ matrix.target }}/dist/${{ matrix.binary }}" "stage/${{ matrix.binary }}"
          cp helper/*android.apk stage/aubridge.apk
          cp README.md LICENSE SECURITY.md stage/
          cp docs/agents/install.md stage/install.md
          mkdir -p stage/skills/android-use
          cp -R skills/android-use/. stage/skills/android-use/
          if [ "${{ matrix.archive }}" = zip ]; then
            (cd stage && 7z a -tzip "../release/$name.zip" . >/dev/null)
          else
            tar -C stage -czf "release/$name.tar.gz" au aubridge.apk README.md LICENSE SECURITY.md install.md skills
          fi
      - name: Smoke-test the binary where this runner can run it
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            aarch64-pc-windows-msvc) echo "cross-built for arm64; not run on this runner" ;;
            x86_64-apple-darwin)
              # Run it under Rosetta when the runner has it; a real failure must still fail the job.
              if arch -x86_64 /usr/bin/true 2>/dev/null; then
                arch -x86_64 "target/${{ matrix.target }}/dist/${{ matrix.binary }}" version
              else
                echo "Rosetta unavailable; not run"
              fi ;;
            *) "target/${{ matrix.target }}/dist/${{ matrix.binary }}" version ;;
          esac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.asset }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Attest and publish GitHub Release
    needs: [gate, validate, sign, host-archives]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Install Rust release toolchain
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Generate checksums and release manifest
        run: cargo +1.94.0 xtask release-manifest release
      - name: Verify the complete release set
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          for asset in $(jq -r '.[] | .asset + "." + .archive' install/platforms.json); do
            test -s "release/android-use-v$version-$asset"
          done
          test -s "release/android-use-v$version-android.apk"
          test -s release/android-use.spdx.json
          test -s release/SHA256SUMS
          test -s release/release-manifest.json
          (cd release && sha256sum --check SHA256SUMS)
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release/*
      - name: Create the stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          cargo +1.94.0 xtask release-notes > release-notes.md
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "android-use v$version" --notes-file release-notes.md

  # npm trusted publishing: the registry trusts this workflow and job through OIDC, so there is no npm token.
  # publish-npm.mjs verifies the attestation of every release asset before it stages anything.
  npm:
    name: Publish the npm packages with provenance
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # NPM_ENV_READY exists only once the owner has configured the environment; GitHub creates a missing one unprotected.
      - name: Require the npm environment to be configured
        if: vars.NPM_ENV_READY != 'true'
        run: echo "::error::Configure the npm environment first (docs/contributing/release.md, owner steps 1 and 6)"; exit 1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@11.5.1
      - run: node install/publish-npm.mjs "$GITHUB_REF_NAME"
      - name: Render the Homebrew formula from attestation-verified checksums
        run: node install/render-formula.mjs "$GITHUB_REF_NAME" > android-use.rb
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: homebrew-formula
          path: android-use.rb
          if-no-files-found: error
