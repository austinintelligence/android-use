name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin Rust toolchain
        shell: powershell
        run: rustup toolchain install 1.94.0 --profile minimal; rustup default 1.94.0
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Release build
        run: cargo build --workspace --release
      - name: Contract and generated skill gates
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/generate-skill.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sync-public-skill.ps1 -Check
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-contract-generated.ps1
      - name: Publish-safe scan
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-public.ps1

  portable-host:
    name: portable-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos-x64
            runner: macos-15-intel
          - name: macos-arm64
            runner: macos-15
          - name: windows-arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin Rust toolchain
        shell: bash
        run: rustup toolchain install 1.94.0 --profile minimal && rustup default 1.94.0
      - name: Native test and release build
        shell: bash
        run: cargo test --workspace --all-targets && cargo build --workspace --release

  helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests and signed CI release compile
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-helper.ps1 -Release -BenchmarkFixture

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.11.1'
          cache: npm
      - run: npm ci
      - run: npm test --workspace packages/installer
      - run: npm run test:packages --workspace packages/installer
      - run: npm run test:tarball --workspace packages/installer
      - run: npm run lint --workspace packages/installer
      - run: npm pack --workspace packages/installer --dry-run
      - run: npm run docs:check
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sync-public-skill.ps1 -Check
