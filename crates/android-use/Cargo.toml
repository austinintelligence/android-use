[package]
name = "android-use"
version = "1.0.0"
edition = "2021"
rust-version = "1.94"
description = "Fast, bounded Android control over ADB"
license = "MIT"
repository = "https://github.com/drperky20/android-use"
homepage = "https://github.com/drperky20/android-use"
documentation = "https://github.com/drperky20/android-use/tree/main/docs"
readme = "../../README.md"
keywords = ["android", "adb", "automation", "agents"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[[bin]]
name = "au"
path = "src/main.rs"

[[bin]]
name = "au-bench-ipc"
path = "src/bin/bench_ipc.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.23"
png = "0.17"
thiserror = "2.0"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading"
] }

[dev-dependencies]
tempfile = "3.14"
