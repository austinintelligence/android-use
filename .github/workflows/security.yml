name: Security

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  dependency-audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin Rust toolchain
        shell: powershell
        run: rustup toolchain install 1.94.0 --profile minimal; rustup default 1.94.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit --file scripts/rust/Cargo.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.11.1'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-public.ps1
