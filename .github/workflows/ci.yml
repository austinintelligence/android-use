name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  computer:
    strategy: { matrix: { os: [ubuntu-24.04, windows-2022, macos-15] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy; rustup default 1.94.0
      - run: cargo +1.94.0 xtask check
      - run: cargo +1.94.0 test --locked --workspace --all-targets
      - run: cargo +1.94.0 build --locked --profile dist -p au
      - run: cargo +1.94.0 xtask binary-size
  helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96
        with: { gradle-version: '9.1.0' }
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
        working-directory: device
  helper-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: { distribution: temurin, java-version: '21' }
      - name: Check helper Java formatting (google-java-format --aosp)
        shell: bash
        run: |
          jar="$RUNNER_TEMP/google-java-format.jar"
          curl -fsSL -o "$jar" https://repo1.maven.org/maven2/com/google/googlejavaformat/google-java-format/1.37.0/google-java-format-1.37.0-all-deps.jar
          echo "834b2a0c38cb774953322a84b5ca3f2f40dd3156650b3cd44d3b744345962f7a  $jar" | sha256sum -c -
          exports=""
          for pkg in api code file parser tree util; do exports="$exports --add-exports=jdk.compiler/com.sun.tools.javac.$pkg=ALL-UNNAMED"; done
          java $exports -jar "$jar" --aosp --dry-run --set-exit-if-changed $(git ls-files 'device/*.java')
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22.18.0', cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run lint
  package-smoke:
    strategy: { matrix: { os: [ubuntu-24.04, macos-15, windows-2022] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22.18.0' }
      - run: rustup toolchain install 1.94.0 --profile minimal; rustup default 1.94.0
      - run: cargo +1.94.0 build --locked -p au
      - name: Pack, install, run, and tamper
        shell: bash
        run: sh install/test/package-smoke.sh "target/debug/au$([ "$RUNNER_OS" = Windows ] && echo .exe)"
