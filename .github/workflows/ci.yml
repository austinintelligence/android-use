name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  computer:
    strategy: { matrix: { os: [ubuntu-24.04, windows-2022, macos-15] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy; rustup default 1.94.0
      - run: cargo +1.94.0 xtask check
      - run: cargo +1.94.0 test --workspace --all-targets
      - run: cargo +1.94.0 build --profile dist -p au
  helper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96
        with: { gradle-version: '9.1.0' }
      - run: gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
        working-directory: device
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '20.11.1', cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run lint
