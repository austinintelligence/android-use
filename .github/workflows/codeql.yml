name: CodeQL
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '41 3 * * 1' }]
permissions: { contents: read, security-events: write }
jobs:
  analyze:
    strategy:
      matrix:
        include:
          - { language: rust, mode: none }
          - { language: javascript-typescript, mode: none }
          - { language: java-kotlin, mode: manual }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96
        with: { gradle-version: '9.1.0' }
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38
        with: { languages: '${{ matrix.language }}', build-mode: '${{ matrix.mode }}' }
      - if: matrix.language == 'java-kotlin'
        run: gradle --no-daemon :app:assembleRelease
        working-directory: device
      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38
