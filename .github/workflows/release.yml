name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver tag, for example 1.0.0'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub release as prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - name: Require owner-managed helper signing material
        shell: powershell
        env:
          AUBRIDGE_KEYSTORE_B64: ${{ secrets.AUBRIDGE_KEYSTORE_B64 }}
          AUBRIDGE_STORE_PASSWORD: ${{ secrets.AUBRIDGE_STORE_PASSWORD }}
          AUBRIDGE_KEY_PASSWORD: ${{ secrets.AUBRIDGE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUBRIDGE_KEYSTORE_B64) -or [string]::IsNullOrWhiteSpace($env:AUBRIDGE_STORE_PASSWORD) -or [string]::IsNullOrWhiteSpace($env:AUBRIDGE_KEY_PASSWORD)) { throw 'Owner action required: configure the persistent AU Bridge signing secrets before publishing.' }
          $state = Join-Path $env:LOCALAPPDATA 'Codex\android-use'
          New-Item -ItemType Directory -Force -Path (Join-Path $state 'keys') | Out-Null
          $key = Join-Path $state 'keys\aubridge.keystore'
          [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:AUBRIDGE_KEYSTORE_B64))
          @("storeFile=$key", "storePassword=$env:AUBRIDGE_STORE_PASSWORD", 'keyAlias=aubridge', "keyPassword=$env:AUBRIDGE_KEY_PASSWORD") | Set-Content -LiteralPath (Join-Path $state 'signing.properties') -Encoding Ascii
      - name: Build host
        run: cargo build --workspace --release
      - name: Build signed helper
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-helper.ps1 -Release
      - name: Prepare release assets and manifest
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ inputs.version }}'
          $packageVersion = (Get-Content packages/installer/package.json -Raw | ConvertFrom-Json).version
          if ($version -ne $packageVersion) { throw "Release input $version must match installer package version $packageVersion" }
          $tag = "v$version"
          $dir = Join-Path $PWD 'release\assets'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item crates/android-use/target/release/au.exe (Join-Path $dir 'au-windows-x64.exe') -Force
          Copy-Item android/aubridge/app/build/outputs/apk/release/app-release.apk (Join-Path $dir 'dev.codex.aubridge.apk') -Force
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-release-manifest.ps1 -Version $version -ReleaseBaseUrl "https://github.com/${{ github.repository }}/releases/download/$tag" -HostBinary (Join-Path $dir 'au-windows-x64.exe') -HelperApk (Join-Path $dir 'dev.codex.aubridge.apk') -Output (Join-Path $dir 'release-manifest.json')
          node scripts/generate-sbom.mjs $dir
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-checksums.ps1 -Directory $dir -Output (Join-Path $dir 'checksums.txt')
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/check-public.ps1
      - name: Attest host and helper artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: 'release/assets/**'
      - name: Publish immutable-ready draft release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ inputs.version }}'
          $tag = "v$version"
          $dir = Join-Path $PWD 'release\assets'
          gh release create $tag --draft --title "android-use $tag" --notes-file CHANGELOG.md $(if ('${{ inputs.prerelease }}' -eq 'true') { '--prerelease' })
          gh release upload $tag (Get-ChildItem -LiteralPath $dir -File | Select-Object -ExpandProperty FullName) --clobber
          gh release edit $tag --draft=false
      - name: Publish installer with provenance
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: powershell
        run: |
          # Trusted publishing uses GitHub OIDC when configured on npm. The
          # token branch remains available for owners who manage NPM_TOKEN.
          if (-not [string]::IsNullOrWhiteSpace($env:NPM_TOKEN)) {
            npm config set //registry.npmjs.org/:_authToken=$env:NPM_TOKEN
          }
          npm publish packages/installer --access public --provenance
